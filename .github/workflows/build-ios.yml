name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Prepare project resources
        run: |
          python3 scripts/prepare-ios.py
          python3 scripts/generate-project.py
      - name: Build unsigned app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project ios/BibleStoryPuzzle.xcodeproj \
            -scheme BibleStoryPuzzle -sdk iphoneos -configuration Release \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build >build-device.log 2>&1 || { tail -100 build-device.log; exit 1; }
      - name: Package unsigned IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/BibleStoryPuzzle.app Payload/
          python3 scripts/package-ipa.py Payload/BibleStoryPuzzle.app BibleStoryPuzzle-unsigned.ipa
          codesign -dv Payload/BibleStoryPuzzle.app >codesign.txt 2>&1 || true
          if grep -q "Authority=" codesign.txt; then echo "Unexpected signature in unsigned build"; exit 1; fi
          file Payload/BibleStoryPuzzle.app/BibleStoryPuzzle
          python3 scripts/verify-ipa.py BibleStoryPuzzle-unsigned.ipa
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: BibleStoryPuzzle-unsigned-ipa
          path: |
            BibleStoryPuzzle-unsigned.ipa
            codesign.txt
          if-no-files-found: error
      - name: Select available iPhone simulator
        run: python3 scripts/simulator-destination.py >> "$GITHUB_ENV"
      - name: Launch application in iPhone simulator
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl boot "$PUZZLE_SIMULATOR" || true
          xcrun simctl bootstatus "$PUZZLE_SIMULATOR" -b
          echo "Simulator booted; compiling test app"
          xcodebuild -project ios/BibleStoryPuzzle.xcodeproj \
            -scheme BibleStoryPuzzle -configuration Debug -destination "id=$PUZZLE_SIMULATOR" \
            -derivedDataPath simulator-build ONLY_ACTIVE_ARCH=YES build-for-testing >build-simulator.log 2>&1 || { tail -80 build-simulator.log; exit 1; }
          echo "Test app built; installing"
          xcrun simctl install "$PUZZLE_SIMULATOR" simulator-build/Build/Products/Debug-iphonesimulator/BibleStoryPuzzle.app
          echo "App installed; launching"
          xcrun simctl launch "$PUZZLE_SIMULATOR" com.iszkq.biblestorypuzzle
          sleep 15
          curl --max-time 15 -v http://127.0.0.1:18765/index.html -o launch-page.html 2>local-server.log || true
          xcrun simctl io "$PUZZLE_SIMULATOR" screenshot simulator-launch.png
          xcrun simctl terminate "$PUZZLE_SIMULATOR" com.iszkq.biblestorypuzzle || true
      - name: Upload simulator launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-launch-evidence
          path: |
            simulator-launch.png
            local-server.log
            launch-page.html
      - name: Test offline launch and native picker bridge
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project ios/BibleStoryPuzzle.xcodeproj \
            -scheme BibleStoryPuzzle -configuration Debug \
            -destination "id=$PUZZLE_SIMULATOR" -derivedDataPath simulator-build \
            -parallel-testing-enabled NO -maximum-test-execution-time-allowance 90 -test-timeouts-enabled YES \
            -resultBundlePath ui-tests.xcresult test-without-building >>build-simulator.log 2>&1 || { tail -120 build-simulator.log; exit 1; }
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-diagnostics
          path: |
            build-device.log
            build-simulator.log
            ui-tests.xcresult
            codesign.txt
            simulator-launch.png
            local-server.log
            launch-page.html
