if(type==='replace')body=`<h3>开始新的故事？</h3><p class="muted">首版只保留一个未完成局。旧局进度将被替换，已发现和收藏保留。</p>${button('开始新故事','replaceConfirmed')}${button('取消','closeSheet','text-button')}`;
if(type==='content')body=`<h3>内容说明</h3><p>故事文字是独立概述，展示经文出处。逐字经文须先确定译本与使用条件。插画是艺术化表达，定稿前需核对情节。</p>${button('我知道了','closeSheet')}`;
if(type==='storage')body=`<h3>本地存档</h3><p>图片、草稿、拼图进度和收藏仅保存到当前设备。没有账号或云端同步；删除App或清除网站数据会失去本地内容。</p>${button('我知道了','closeSheet')}`;
if(type==='clear')body=`<h3>清除所有游玩进度？</h3><p>已发现、收藏和未完成局都会删除。我的故事集和草稿会保留。</p>${button('清除进度','resetConfirmed')}${button('取消','closeSheet','text-button')}`;
document.getElementById('overlay').innerHTML=`<div class="modal-shade"><section class="sheet" role="dialog" aria-modal="true" aria-label="${type==='pause'?'暂停':type==='preview'?'完整图片预览':type==='puzzleCorrect'?'拼图正确':type==='puzzleIncorrect'?'拼图仍有错误':'操作说明'}">${body}</section></div>`;document.querySelector('.sheet button')?.focus();
}
function toast(text){const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=text;document.getElementById('overlay').append(el);setTimeout(()=>el.remove(),1800);}
function closeSheet(){const previous=sheet;sheet=null;document.getElementById('overlay').innerHTML='';if(previous==='restart'&&current())count=state.current.count;if(previous==='puzzleCorrect'&&['guess','reveal'].includes(current()?.phase)){dialogReturn=null;go(state.current.phase);return;}if(dialogReturn?.isConnected)dialogReturn.focus();else document.querySelector('#screen button')?.focus();dialogReturn=null;}
document.addEventListener('click',e=>{const target=e.target.closest('[data-action]');if(!target)return;const [action,...parts]=target.dataset.action.split(':');const arg=parts.join(':');
if(action==='go'){if(['home','collection'].includes(arg))persist();go(arg);return;}
if(action==='inspect'){if(['puzzle','guess'].includes(arg))ensure();if(['guess','reveal'].includes(arg)&&current()?.submitResult!=='correct'&&!state.completed.includes(storyID)){toast('请先提交拼图并通过校验。');return;}go(arg);return;}
if(action==='first'){storyID=1;count=12;go('prepare');return;}
if(action==='resume'){if(state.current){storyID=state.current.storyID;count=state.current.count;go(state.current.phase);}else if(state.completed.filter(id=>id<=6).length===6){go('collection');}else{storyID=stories.find(s=>!s.custom&&!state.completed.includes(s.id)).id;go('prepare');}return;}
if(action==='choose'){const id=Number(arg);if(id>1&&!state.completed.includes(id-1)){toast('完成前一个故事后开启。');return;}storyID=id;if(state.completed.includes(id)){go('detail');}else{count=current()?.count||12;go('prepare');}return;}
if(action==='difficulty'){const value=Number(arg);if(current()&&value!==state.current.count){count=value;showSheet('restart');}else{count=value;render();}return;}
if(action==='start'){if(state.current&&!current()){pendingStory=storyID;showSheet('replace');return;}if(!current())makeCurrent();go(state.current.phase);return;}
if(action==='replaceConfirmed'){storyID=pendingStory;pendingStory=null;makeCurrent();go('puzzle');return;}
if(action==='restart'){showSheet('restart');return;}
if(action==='restartConfirmed'){makeCurrent();go('puzzle');return;}
if(action==='pan'){state.current.panMode=!state.current.panMode;persist();renderKeepingPosition();return;}
if(action==='zoom'){state.current.zoom=!state.current.zoom;state.current.panMode=false;state.current.panX=0;state.current.panY=0;persist();renderKeepingPosition();return;}
if(action==='tray'){state.current.trayPage=Math.max(0,(state.current.trayPage||0)+Number(arg));persist();renderKeepingPosition();return;}
if(action==='submit'){submitPuzzle();return;}
if(action==='previewZoom'){const el=document.querySelector('.preview-window');el.classList.toggle('large');target.textContent=el.classList.contains('large')?'适合窗口':'放大图片';return;}
if(action==='sheet'){showSheet(arg);return;}
if(action==='closeSheet'){closeSheet();return;}
if(action==='previewBack'){closeSheet();return;}
if(action==='toGuess'){if(current()?.phase!=='guess'||current()?.submitResult!=='correct')return;go('guess');return;}
if(action==='answer'){chosen=arg;result='';state.current.chosen=chosen;state.current.result=result;persist();render();return;}
if(action==='confirm'){result=chosen===story().person?'correct':'wrong';state.current.result=result;persist();render();return;}
if(action==='toReveal'){if(current()?.submitResult!=='correct')return;finish();state.current.phase='reveal';if(result!=='correct')state.current.result='revealed';persist();go('reveal');return;}
if(action==='save'){if(!state.completed.includes(storyID)){toast('流程预览：先拼完并揭晓后才能收藏。');return;}const i=state.collected.indexOf(storyID);if(i>=0)state.collected.splice(i,1);else state.collected.push(storyID);persist();render();toast(i>=0?'已取消收藏':'已加入收藏');return;}
if(action==='next'){storyID=Math.min(6,storyID+1);state.current=null;count=12;persist();go('prepare');return;}
if(action==='leave'){state.current=null;persist();go('home');return;}
if(action==='exit'){persist();go('home');return;}
if(action==='filter'){filter=arg;render();return;}
if(action==='open'){const id=Number(arg);if(!state.completed.includes(id)){toast('完成这个故事后，人物和插画会在这里揭晓。');return;}storyID=id;go('detail');return;}
if(action==='replay'){count=12;go('prepare');return;}
if(action==='reset'){showSheet('clear');return;}
if(action==='resetConfirmed'){state=initial();storyID=1;count=12;selectedPiece=null;chosen=null;result='';persist();go('welcome');return;}
});
document.addEventListener('change',e=>{if(e.target.dataset.setting){state.settings[e.target.dataset.setting]=e.target.checked;persist();}});
document.addEventListener('keydown',e=>{const dialog=document.querySelector('.sheet');if(!dialog)return;if(e.key==='Escape'){e.preventDefault();closeSheet();return;}if(e.key==='Tab'){const nodes=[...dialog.querySelectorAll('button:not(:disabled),a,input')];const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}});
function normalizeGridSave(){const c=state.current;if(!c?.positions)return;const {cols,rows}=gridFor(c.count),used=new Set();for(const id of c.placed){const p=c.positions[id];if(!p)continue;let slot=Math.max(0,Math.min(rows-1,Math.floor(p.y*rows)))*cols+Math.max(0,Math.min(cols-1,Math.floor(p.x*cols)));if(used.has(slot)){delete c.positions[id];continue;}used.add(slot);c.positions[id]={...p,slot,x:(slot%cols+.5)/cols,y:(Math.floor(slot/cols)+.5)/rows};}c.placed=c.placed.filter(id=>c.positions[id]);persist();}
// Fragment geometry is independent of placement. No target information is used while dragging.
const sceneNames=['moses','noah','david','ruth','daniel','esther'];
const sceneURL=(id=storyID)=>stories.find(s=>s.id===id)?.image||'assets/'+sceneNames[id-1]+'.jpg';
const gridFor=n=>n===48?{cols:8,rows:6}:n===24?{cols:6,rows:4}:{cols:4,rows:3};
function piecePath(id,n){
 const {cols,rows}=gridFor(n),col=id%cols,row=Math.floor(id/cols);
 let d='M 0 0';
 function edge(x,y,dx,dy,nx,ny,sign){
  const p=(t,h)=>`${x+dx*t+nx*h} ${y+dy*t+ny*h}`;
  if(!sign){d+=` L ${p(1,0)}`;return;}
  d+=` L ${p(.32,0)} C ${p(.4,0)} ${p(.32,18*sign)} ${p(.5,18*sign)} C ${p(.68,18*sign)} ${p(.6,0)} ${p(.68,0)} L ${p(1,0)}`;
 }
 const h=(r,c)=>(r*13+c*7)%2?1:-1,v=(r,c)=>(r*11+c*3)%2?1:-1;
 edge(0,0,100,0,0,-1,row?h(row,col):0);
 edge(100,0,0,100,1,0,col<cols-1?v(row,col+1):0);
 edge(100,100,-100,0,0,1,row<rows-1?-h(row+1,col):0);
 edge(0,100,0,-100,-1,0,col?-v(row,col):0);
 return d+' Z';
}
function pieceSVG(id,where='tray'){
 const {cols,rows}=gridFor(count),col=id%cols,row=Math.floor(id/cols),clip=`p-${where}-${storyID}-${id}`;
 const d=piecePath(id,count);
 return `<svg viewBox="-22 -22 144 144" preserveAspectRatio="none" aria-hidden="true" draggable="false"><defs><clipPath id="${clip}"><path d="${d}"/></clipPath><clipPath id="hit-${clip}" clipPathUnits="objectBoundingBox"><path d="${d}" transform="scale(0.0069444444) translate(22 22)"/></clipPath></defs><image href="${sceneURL()}" x="${-col*100}" y="${-row*100}" width="${cols*100}" height="${rows*100}" preserveAspectRatio="none" clip-path="url(#${clip})"/><path d="${d}" fill="none" stroke="rgba(0,0,0,.22)" stroke-width=".7"/></svg>`;
}
function puzzleHTML(){
 const c=state.current,{cols,rows}=gridFor(count),remaining=c.trayOrder.filter(id=>!c.positions[id]);
 const page=remaining,placed=Object.keys(c.positions).length;
 const board=c.placed.map(id=>{const p=c.positions[id];return `<button class="fragment on-board" data-piece="${id}" aria-label="已摆放图像碎片；方向键移动到相邻格，Delete退回托盘" style="left:${p.x*100}%;top:${p.y*100}%;width:${144/cols}%;height:${144/rows}%;z-index:${p.z};clip-path:url(#hit-p-board-${storyID}-${id})">${pieceSVG(id,'board')}</button>`}).join('');
 return `<div class="puzzle-content"><div class="bar">${button('关闭','exit','icon-button')}<strong>${number(storyID)} · ${count}块</strong>${button('暂停','sheet:pause','icon-button')}</div><div class="row"><span>已摆放 ${placed}/${count}</span><span class="small muted">摆放时不判对错</span></div><div class="progress"><i style="width:${placed/count*100}%"></i></div><div class="play-tools">${button('查看原图','sheet:preview','text-button')}${button(c.zoom?'适合画框':'放大棋盘','zoom','text-button')}${c.zoom?button(c.panMode?'继续摆放':'浏览棋盘','pan','text-button',`aria-pressed="${!!c.panMode}"`):''}</div><div class="board-window ${c.zoom?'enlarged':''}" aria-label="画框滚动区域"><div class="free-board ${c.zoom?'zoomed':''} ${c.panMode?'pan-mode':''}" aria-label="网格拼图画框，按难度划分的格子"><div class="board-grid" style="grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${rows},1fr)">${Array.from({length:count},()=>'<div class="board-cell"></div>').join('')}</div>${board}</div></div><div class="row tray-label"><strong>碎片托盘 · 剩余 ${remaining.length}</strong><span class="small muted">拖回这里可取下</span></div><div class="fragment-tray" aria-label="乱序碎片托盘">${page.map(id=>`<button class="fragment in-tray" data-piece="${id}" aria-label="待摆放图像碎片；按Enter移入画框后用方向键换格" style="--piece-ratio:${4*rows/(3*cols)}">${pieceSVG(id)}</button>`).join('')}${!remaining.length?'<span class="small muted tray-empty">可以继续移动画面中的碎片。</span>':''}</div><p class="tray-summary">全部碎片 · 上下滚动查看更多</p><div class="submit-dock">${button('提交拼图','submit')}<p class="small muted game-help">对照原图，觉得拼好了再提交。</p></div></div>`;
}
function renderKeepingPosition(focusID=null){
 const screenEl=document.getElementById('screen'),scroll=screenEl.scrollTop,bw=document.querySelector('.board-window');
 if(bw){state.current.panX=bw.scrollLeft;state.current.panY=bw.scrollTop;}const tray=document.querySelector('.fragment-tray');if(tray)state.current.trayScroll=tray.scrollTop;
 render();screenEl.scrollTop=scroll;
 if(focusID!==null)document.querySelector(`[data-piece="${focusID}"]`)?.focus({preventScroll:true});
}
function syncPlaced(){state.current.placed=Object.keys(state.current.positions).map(Number).sort((a,b)=>state.current.positions[a].z-state.current.positions[b].z);}
function dropPiece(id,x,y){const c=state.current,{cols,rows}=gridFor(count),col=Math.max(0,Math.min(cols-1,Math.floor(x*cols))),row=Math.max(0,Math.min(rows-1,Math.floor(y*rows))),slot=row*cols+col,old=c.positions[id];const occupant=Object.keys(c.positions).find(other=>Number(other)!==id&&c.positions[other].slot===slot);if(occupant!==undefined){if(old)c.positions[occupant]={...old,z:++c.layer};else delete c.positions[occupant];}c.positions[id]={slot,x:(col+.5)/cols,y:(row+.5)/rows,z:++c.layer};c.submitResult='';syncPlaced();persist();}
function returnPiece(id){delete state.current.positions[id];state.current.submitResult='';syncPlaced();persist();}
function submitPuzzle(){
 const c=current();if(!c||c.phase!=='puzzle')return;
 c.submitAttempts=(c.submitAttempts||0)+1;
 if(Object.keys(c.positions).length!==count){c.submitResult='incomplete';persist();showSheet('incomplete');return;}
 const {cols,rows}=gridFor(count);
 const valid=Array.from({length:count},(_,id)=>{const p=c.positions[id];return p&&p.slot===id;}).every(Boolean);
 c.submitResult=valid?'correct':'incorrect';
 if(valid){c.phase=isCustom(storyID)&&!story().quizEnabled?'reveal':'guess';if(!creator.trial&&!state.completed.includes(storyID))state.completed.push(storyID);}
 persist();showSheet(valid?'puzzleCorrect':'puzzleIncorrect');
}
let drag=null;
function moveGhost(e){
 const {cols,rows}=gridFor(count),board=document.querySelector('.free-board').getBoundingClientRect();
 const offset=e.pointerType==='touch'?28:0;
 drag.x=e.clientX;drag.y=e.clientY-offset;
 drag.ghost.style.width=board.width/cols*1.44+'px';drag.ghost.style.height=board.height/rows*1.44+'px';
 drag.ghost.style.left=drag.x+'px';drag.ghost.style.top=drag.y+'px';
}
document.addEventListener('pointerdown',e=>{
 const el=e.target.closest('[data-piece]');if(!el||state.current?.panMode||screen!=='puzzle'||sheet||drag||e.button!==0||state.current.phase!=='puzzle')return;
 e.preventDefault();el.focus({preventScroll:true});
 drag={id:Number(el.dataset.piece),el,pointer:e.pointerId,startX:e.clientX,startY:e.clientY,active:false};
 el.setPointerCapture(e.pointerId);
});
document.addEventListener('pointermove',e=>{
 if(!drag||e.pointerId!==drag.pointer)return;
 if(!drag.active&&Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)<6)return;
 e.preventDefault();
 if(!drag.active){drag.active=true;drag.ghost=document.createElement('div');drag.ghost.className='drag-ghost';drag.ghost.innerHTML=pieceSVG(drag.id,'ghost');document.body.append(drag.ghost);drag.el.classList.add('dragging');}
 moveGhost(e);
});
function cancelDrag(){if(!drag)return;drag.ghost?.remove();drag.el.classList.remove('dragging');if(drag.el.hasPointerCapture?.(drag.pointer))drag.el.releasePointerCapture(drag.pointer);drag=null;}
document.addEventListener('pointerup',e=>{
 if(!drag||e.pointerId!==drag.pointer)return;
 const d=drag;if(!d.active){cancelDrag();return;}
 moveGhost(e);
 const board=document.querySelector('.free-board').getBoundingClientRect(),view=document.querySelector('.board-window').getBoundingClientRect(),tray=document.querySelector('.fragment-tray').getBoundingClientRect();
 const inside=(r,x,y)=>x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;
 const onBoard=inside(view,d.x,d.y)&&inside(board,d.x,d.y);
 if(onBoard)dropPiece(d.id,(d.x-board.left)/board.width,(d.y-board.top)/board.height);
 else if(inside(tray,e.clientX,e.clientY))returnPiece(d.id);
 cancelDrag();renderKeepingPosition();
});
document.addEventListener('pointercancel',cancelDrag);
window.addEventListener('blur',cancelDrag);
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelDrag();persist();}});
document.addEventListener('scroll',e=>{
 if(e.target.classList?.contains('fragment-tray')&&current()){state.current.trayScroll=e.target.scrollTop;persist();}
 if(e.target.classList?.contains('board-window')&&current()){state.current.panX=e.target.scrollLeft;state.current.panY=e.target.scrollTop;persist();}
},true);
document.addEventListener('keydown',e=>{
 const el=e.target.closest?.('[data-piece]');if(!el||state.current?.panMode||screen!=='puzzle'||sheet||state.current.phase!=='puzzle')return;
 const id=Number(el.dataset.piece),p=state.current.positions[id];
 if(e.key==='Enter'&&!p){e.preventDefault();dropPiece(id,.5,.5);renderKeepingPosition(id);return;}
 if(e.key==='Delete'&&p){e.preventDefault();returnPiece(id);renderKeepingPosition(id);return;}
 if(!p||!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))return;
 e.preventDefault();const {cols,rows}=gridFor(count);const step=1/cols;
 dropPiece(id,Math.max(0,Math.min(1,p.x+(e.key==='ArrowRight'?step:e.key==='ArrowLeft'?-step:0))),Math.max(0,Math.min(1,p.y+(e.key==='ArrowDown'?1/rows:e.key==='ArrowUp'?-1/rows:0))));
 renderKeepingPosition(id);
});

</script>

recoverTrial();
normalizeGridSave();
render();
